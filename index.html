<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Play.io - Game Hub</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      text-align: center;
      padding: 40px 20px;
    }
    h1 { color: #00ffcc; }
    .games {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 30px;
    }
    .card {
      background: #222;
      border: 1px solid #333;
      padding: 20px;
      border-radius: 8px;
      text-decoration: none;
      color: #fff;
      font-weight: bold;
    }
    .card:hover { border-color: #00ffcc; }
  </style>
</head>
<body>
  <h1>Welcome to Play.io</h1>
  <p>Select a game to start playing:</p>

  <div class="games">
    <div class="card">Game 1 (Coming Soon)</div>
    <div class="card">Game 2 (Coming Soon)</div>
  </div>
</body>
</html>
