<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clicker Speed - Play.io</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0d1117; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
    .top-bar { width: 100%; max-width: 360px; margin-bottom: 20px; }
    .top-bar a { color: #58a6ff; text-decoration: none; font-weight: 600; }
    .stats { display: flex; gap: 30px; font-size: 1.2rem; margin-bottom: 24px; }
    .btn-tap { width: 220px; height: 220px; border-radius: 50%; background: #238636; border: 4px solid #2ea043; color: #fff; font-size: 1.8rem; font-weight: bold; cursor: pointer; outline: none; user-select: none; }
    .btn-tap:active { transform: scale(0.96); background: #2ea043; }
    .btn-reset { margin-top: 24px; padding: 10px 24px; background: #21262d; border: 1px solid #30363d; border-radius: 6px; color: #58a6ff; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <div class="top-bar">
    <a href="games.html">&larr; Back to Games</a>
  </div>

  <div class="stats">
    <div>Time: <span id="timeLeft">10</span>s</div>
    <div>Clicks: <span id="clicks">0</span></div>
  </div>

  <button class="btn-tap" id="tapBtn" onclick="registerClick()">TAP!</button>
  <button class="btn-reset" onclick="resetGame()">Reset</button>

  <script>
    let clicks = 0;
    let timeLeft = 10;
    let timer = null;
    let active = false;

    function registerClick() {
      if (timeLeft <= 0) return;
      if (!active) {
        active = true;
        timer = setInterval(() => {
          timeLeft--;
          document.getElementById("timeLeft").innerText = timeLeft;
          if (timeLeft <= 0) {
            clearInterval(timer);
            const cps = (clicks / 10).toFixed(1);
            alert(`Time up! Total: ${clicks} clicks (${cps} CPS)`);
          }
        }, 1000);
      }
      clicks++;
      document.getElementById("clicks").innerText = clicks;
    }

    function resetGame() {
      clearInterval(timer);
      clicks = 0;
      timeLeft = 10;
      active = false;
      document.getElementById("clicks").innerText = "0";
      document.getElementById("timeLeft").innerText = "10";
    }
  </script>
</body>
</html>
