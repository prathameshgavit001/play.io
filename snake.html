<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake - Play.io</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0d1117; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
    .top-bar { width: 100%; max-width: 400px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .top-bar a { color: #58a6ff; text-decoration: none; font-weight: 600; font-size: 0.95rem; }
    .scoreboard { font-size: 1.1rem; color: #e6edf3; }
    canvas { background: #161b22; border: 2px solid #30363d; border-radius: 8px; width: 100%; max-width: 380px; height: auto; aspect-ratio: 1 / 1; display: block; }
    .d-pad { display: grid; grid-template-columns: repeat(3, 60px); grid-template-rows: repeat(2, 50px); gap: 10px; margin-top: 16px; justify-content: center; }
    .d-btn { background: #21262d; border: 1px solid #30363d; color: #58a6ff; font-size: 1.4rem; border-radius: 6px; display: flex; align-items: center; justify-content: center; user-select: none; }
    .d-btn:active { background: #30363d; }
    .up { grid-column: 2; grid-row: 1; }
    .left { grid-column: 1; grid-row: 2; }
    .down { grid-column: 2; grid-row: 2; }
    .right { grid-column: 3; grid-row: 2; }
  </style>
</head>
<body>
  <div class="top-bar">
    <a href="games.html">&larr; Back to Games</a>
    <div class="scoreboard">Score: <span id="score">0</span></div>
  </div>

  <canvas id="gameCanvas" width="400" height="400"></canvas>

  <div class="d-pad">
    <button class="d-btn up" onclick="setDir('UP')">&#9650;</button>
    <button class="d-btn left" onclick="setDir('LEFT')">&#9664;</button>
    <button class="d-btn down" onclick="setDir('DOWN')">&#9660;</button>
    <button class="d-btn right" onclick="setDir('RIGHT')">&#9654;</button>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const grid = 20;
    let count = 0;
    let score = 0;
    let snake = { x: 160, y: 160, dx: grid, dy: 0, cells: [], maxCells: 4 };
    let apple = { x: 320, y: 320 };

    function getRandomInt(min, max) { return Math.floor(Math.random() * (max - min)) + min; }

    function reset() {
      snake.x = 160; snake.y = 160;
      snake.cells = []; snake.maxCells = 4;
      snake.dx = grid; snake.dy = 0;
      score = 0;
      document.getElementById("score").innerText = score;
      apple.x = getRandomInt(0, 20) * grid;
      apple.y = getRandomInt(0, 20) * grid;
    }

    function setDir(dir) {
      if (dir === 'UP' && snake.dy === 0) { snake.dy = -grid; snake.dx = 0; }
      else if (dir === 'DOWN' && snake.dy === 0) { snake.dy = grid; snake.dx = 0; }
      else if (dir === 'LEFT' && snake.dx === 0) { snake.dx = -grid; snake.dy = 0; }
      else if (dir === 'RIGHT' && snake.dx === 0) { snake.dx = grid; snake.dy = 0; }
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowUp") setDir('UP');
      else if (e.key === "ArrowDown") setDir('DOWN');
      else if (e.key === "ArrowLeft") setDir('LEFT');
      else if (e.key === "ArrowRight") setDir('RIGHT');
    });

    function loop() {
      requestAnimationFrame(loop);
      if (++count < 6) return;
      count = 0;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      snake.x += snake.dx;
      snake.y += snake.dy;

      if (snake.x < 0) snake.x = canvas.width - grid;
      else if (snake.x >= canvas.width) snake.x = 0;
      if (snake.y < 0) snake.y = canvas.height - grid;
      else if (snake.y >= canvas.height) snake.y = 0;

      snake.cells.unshift({ x: snake.x, y: snake.y });
      if (snake.cells.length > snake.maxCells) snake.cells.pop();

      ctx.fillStyle = "#f85149";
      ctx.fillRect(apple.x, apple.y, grid - 1, grid - 1);

      ctx.fillStyle = "#58a6ff";
      snake.cells.forEach((cell, index) => {
        ctx.fillRect(cell.x, cell.y, grid - 1, grid - 1);
        if (cell.x === apple.x && cell.y === apple.y) {
          snake.maxCells++;
          score += 10;
          document.getElementById("score").innerText = score;
          apple.x = getRandomInt(0, 20) * grid;
          apple.y = getRandomInt(0, 20) * grid;
        }
        for (let i = index + 1; i < snake.cells.length; i++) {
          if (cell.x === snake.cells[i].x && cell.y === snake.cells[i].y) reset();
        }
      });
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
