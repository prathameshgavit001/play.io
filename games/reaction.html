<!DOCTYPE html>
<html lang="en">
<head>
<!--
GAME_META
title: Reaction Speed Test
badge: Reflex Test
description: Wait for the red screen to turn green and tap immediately to measure response time.
-->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reaction Test - Play.io</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0d1117; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
    .top-bar { width: 100%; max-width: 420px; margin-bottom: 16px; }
    .top-bar a { color: #58a6ff; text-decoration: none; font-weight: 600; }
    #targetBox { width: 100%; max-width: 420px; height: 320px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; cursor: pointer; user-select: none; transition: background 0.15s; background: #161b22; border: 2px solid #30363d; padding: 20px; }
    #targetBox.waiting { background: #da3633; border-color: #f85149; }
    #targetBox.ready { background: #238636; border-color: #2ea043; }
    h2 { font-size: 1.6rem; pointer-events: none; margin-bottom: 8px; }
    p { color: #e6edf3; pointer-events: none; }
  </style>
</head>
<body>
  <div class="top-bar">
    <a href="../games.html">&larr; Back to Games</a>
  </div>

  <div id="targetBox" onclick="handleClick()">
    <h2 id="heading">Click to Start</h2>
    <p id="sub">When the box turns green, tap as fast as you can!</p>
  </div>

  <script>
    const box = document.getElementById("targetBox");
    const heading = document.getElementById("heading");
    const sub = document.getElementById("sub");

    let state = "idle";
    let startTime = 0;
    let timeoutId = null;

    function handleClick() {
      if (state === "idle") {
        state = "waiting";
        box.className = "waiting";
        heading.innerText = "Wait for Green...";
        sub.innerText = "Don't click yet!";
        const delay = Math.floor(Math.random() * 3000) + 1500;
        timeoutId = setTimeout(() => {
          state = "ready";
          box.className = "ready";
          heading.innerText = "TAP NOW!";
          sub.innerText = "";
          startTime = performance.now();
        }, delay);
      } else if (state === "waiting") {
        clearTimeout(timeoutId);
        state = "idle";
        box.className = "";
        heading.innerText = "Too early!";
        sub.innerText = "Click to try again.";
      } else if (state === "ready") {
        const elapsed = Math.round(performance.now() - startTime);
        state = "idle";
        box.className = "";
        heading.innerText = `${elapsed} ms`;
        sub.innerText = "Click anywhere to try again!";
      }
    }
  </script>
</body>
</html>
