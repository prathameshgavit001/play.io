<!DOCTYPE html>
<html lang="en">
<head>
    <!-- PLAYIO_GAME_METADATA_START
    {
      "id": "subway-runner",
      "title": "Subway Runner: Neon Dash",
      "category": "Action / Endless Runner",
      "description": "Solo 3D infinite runner with local high-score tracking, SVG touch controls, pause menu, and gradual speed progression.",
      "thumbnail": "assets/thumbnails/subway-runner.png",
      "orientation": "landscape",
      "multiplayer": false
    }
    PLAYIO_GAME_METADATA_END -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Subway Runner: Neon Dash | Playio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0b0d17;
            color: #fff;
            touch-action: manipulation;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            pointer-events: none;
        }

        /* Top HUD */
        .top-bar {
            position: absolute;
            top: 16px;
            left: 16px;
            right: 16px;
            z-index: 50;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
        }
        .top-left, .top-center, .top-right {
            display: flex;
            align-items: center;
            gap: 12px;
            pointer-events: auto;
        }
        .top-center {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: none;
        }

        .hud-btn {
            background: rgba(24, 29, 48, 0.85);
            border: 1px solid #33416b;
            color: #fff;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            backdrop-filter: blur(4px);
        }
        .hud-btn:active {
            background: #00f2fe;
            color: #0b0d17;
        }

        .hud-stat {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.6);
        }
        .hud-high-score {
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 1px;
            color: #ffd700;
            text-shadow: 0 0 12px rgba(255, 215, 0, 0.6);
        }

        /* Bottom SVG Touch / Image Buttons */
        .touch-controls {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 24px;
            z-index: 60;
            pointer-events: auto;
        }
        .ctrl-btn {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            border: 2px solid rgba(0, 242, 254, 0.5);
            background: rgba(15, 17, 26, 0.8);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            outline: none;
            touch-action: manipulation;
        }
        .ctrl-btn svg {
            width: 32px;
            height: 32px;
            fill: #00f2fe;
            pointer-events: none;
        }
        .ctrl-btn:active {
            transform: scale(0.92);
            background: #00f2fe;
            border-color: #00f2fe;
        }
        .ctrl-btn:active svg {
            fill: #050b14;
        }

        .ctrl-jump {
            border-color: rgba(56, 239, 125, 0.6);
        }
        .ctrl-jump svg {
            fill: #38ef7d;
        }
        .ctrl-jump:active {
            background: #38ef7d;
            border-color: #38ef7d;
        }
        .ctrl-jump:active svg {
            fill: #050b14;
        }

        /* Overlay & Modals */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 12, 22, 0.94);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
        }
        .modal {
            background: #181d30;
            padding: 28px;
            border-radius: 14px;
            width: 360px;
            max-width: 90%;
            border: 1px solid #2d3758;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            gap: 14px;
            text-align: center;
        }
        .modal h2 {
            font-size: 26px;
            font-weight: 900;
            color: #00f2fe;
        }
        .score-highlight {
            font-size: 46px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(0, 242, 254, 0.8);
            margin: 4px 0;
        }
        .high-score-note {
            font-size: 14px;
            font-weight: 700;
            color: #ffd700;
        }

        button.action-btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            color: #050b14;
            font-weight: 800;
            font-size: 15px;
            cursor: pointer;
        }
        button.action-btn:active {
            transform: scale(0.98);
            opacity: 0.9;
        }
        button.secondary-btn {
            background: #252e4d;
            color: #e2e8f0;
        }
        button.secondary-btn:active {
            background: #323d66;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- HUD Elements -->
    <div class="top-bar">
        <div class="top-left">
            <button type="button" class="hud-btn" id="btn-back">◀ Back</button>
            <button type="button" class="hud-btn" id="btn-pause">Pause</button>
        </div>

        <div class="top-center">
            <div class="hud-high-score">HIGH SCORE: <span id="ui-high-score">0</span></div>
        </div>

        <div class="top-right">
            <div class="hud-stat">SCORE: <span id="ui-score">0</span></div>
        </div>
    </div>

    <!-- Image / SVG Touch Controls -->
    <div class="touch-controls" id="touch-controls-panel" style="display: none;">
        <button type="button" class="ctrl-btn" id="ctrl-left" aria-label="Left">
            <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
        </button>
        <button type="button" class="ctrl-btn ctrl-jump" id="ctrl-jump" aria-label="Jump">
            <svg viewBox="0 0 24 24"><path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></svg>
        </button>
        <button type="button" class="ctrl-btn" id="ctrl-right" aria-label="Right">
            <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
        </button>
    </div>

    <!-- Lobby / Start Overlay -->
    <div class="overlay" id="lobby-overlay">
        <div class="modal">
            <h2>Subway Runner</h2>
            <p style="font-size: 13px; color: #94a3b8;">Dodge incoming barriers and beat your record.</p>
            <div class="high-score-note">Best Record: <span id="lobby-high-score">0</span></div>
            <button type="button" class="action-btn" id="btn-start-run">Start Run</button>
            <button type="button" class="action-btn secondary-btn" id="btn-lobby-back">Back to Catalog</button>
        </div>
    </div>

    <!-- Pause Menu Overlay -->
    <div class="overlay" id="pause-overlay" style="display: none;">
        <div class="modal">
            <h2>Game Paused</h2>
            <button type="button" class="action-btn" id="btn-resume">Resume</button>
            <button type="button" class="action-btn secondary-btn" id="btn-pause-restart">Restart</button>
            <button type="button" class="action-btn secondary-btn" id="btn-pause-quit">Quit to Catalog</button>
        </div>
    </div>

    <!-- Crash / Game Over Overlay -->
    <div class="overlay" id="death-overlay" style="display: none;">
        <div class="modal">
            <h2 style="color: #ff416c;">CRASHED!</h2>
            <div style="font-size: 13px; color: #94a3b8;">SCORE</div>
            <div class="score-highlight" id="final-score">0</div>
            <div class="high-score-note" id="death-high-score-wrap">High Score: <span id="death-high-score">0</span></div>
            <button type="button" class="action-btn" id="btn-death-restart">Run Again</button>
            <button type="button" class="action-btn secondary-btn" id="btn-death-quit">Quit to Catalog</button>
        </div>
    </div>

    <script>
        /* -------------------------------------------------------------
           1. GAME ENGINE & STATE
        ------------------------------------------------------------- */
        let scene, camera, renderer, player;
        const lanes = [-3, 0, 3];
        let currentLane = 1;
        let isJumping = false, jumpVelocity = 0;
        
        let score = 0;
        const BASE_SPEED = 0.42;
        let speed = BASE_SPEED;
        let obstacles = [], tracks = [];
        let gameRunning = false;
        let isPaused = false;
        let engineInitialized = false;

        // Persistent Personal High Score
        let highScore = parseInt(localStorage.getItem('playio_subway_highscore') || '0', 10);

        function updateHighScoreDisplay() {
            document.getElementById('ui-high-score').innerText = highScore;
            document.getElementById('lobby-high-score').innerText = highScore;
            document.getElementById('death-high-score').innerText = highScore;
        }

        function initScene() {
            if (typeof THREE === 'undefined') return;

            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x0b0d17, 0.015);

            camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 4, 8);
            camera.rotation.x = -0.3;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x0b0d17);
            container.appendChild(renderer.domElement);

            const ambient = new THREE.AmbientLight(0xffffff, 0.7);
            const dirLight = new THREE.DirectionalLight(0x00f2fe, 0.8);
            dirLight.position.set(5, 10, 7);
            scene.add(ambient, dirLight);

            // Player mesh
            const geom = new THREE.BoxGeometry(1.1, 1.8, 1.1);
            const mat = new THREE.MeshStandardMaterial({ color: 0x38ef7d, roughness: 0.25 });
            player = new THREE.Mesh(geom, mat);
            player.position.set(lanes[currentLane], 0.9, 0);
            scene.add(player);

            for (let i = 0; i < 16; i++) {
                createTrackSlice(-i * 10);
            }

            window.addEventListener('resize', onWindowResize);
            document.addEventListener('keydown', handleKeyInput);
            engineInitialized = true;
        }

        function createTrackSlice(zPos) {
            const geom = new THREE.BoxGeometry(10, 0.2, 10);
            const mat = new THREE.MeshStandardMaterial({ color: 0x181d30 });
            const track = new THREE.Mesh(geom, mat);
            track.position.set(0, -0.1, zPos);
            scene.add(track);
            tracks.push(track);
        }

        function spawnObstacle(zPos) {
            const laneIdx = Math.floor(Math.random() * 3);
            const geom = new THREE.BoxGeometry(1.6, 1.4, 1.2);
            const mat = new THREE.MeshStandardMaterial({ color: 0xff416c });
            const obs = new THREE.Mesh(geom, mat);
            obs.position.set(lanes[laneIdx], 0.7, zPos);
            scene.add(obs);
            obstacles.push({ mesh: obs, lane: laneIdx });
        }

        /* -------------------------------------------------------------
           2. CONTROLS
        ------------------------------------------------------------- */
        function moveLeft() {
            if (!gameRunning || isPaused) return;
            if (currentLane > 0) currentLane--;
        }

        function moveRight() {
            if (!gameRunning || isPaused) return;
            if (currentLane < 2) currentLane++;
        }

        function doJump() {
            if (!gameRunning || isPaused) return;
            if (!isJumping) {
                isJumping = true;
                jumpVelocity = 0.33;
            }
        }

        function handleKeyInput(e) {
            if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') {
                if (gameRunning) togglePause();
                return;
            }
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') moveLeft();
            else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') moveRight();
            else if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.key === ' ') doJump();
        }

        /* -------------------------------------------------------------
           3. GAME LOOP & SPEED PROGRESSION
        ------------------------------------------------------------- */
        function gameLoop() {
            if (!gameRunning || isPaused) return;
            requestAnimationFrame(gameLoop);

            // Interpolate lane movement
            player.position.x += (lanes[currentLane] - player.position.x) * 0.25;

            // Jump handling
            if (isJumping) {
                player.position.y += jumpVelocity;
                jumpVelocity -= 0.018;
                if (player.position.y <= 0.9) {
                    player.position.y = 0.9;
                    isJumping = false;
                }
            }

            // Move tracks
            for (let t of tracks) {
                t.position.z += speed;
                if (t.position.z > 10) t.position.z -= 160;
            }

            // Spawn obstacles
            if (Math.random() < 0.035 && (obstacles.length === 0 || obstacles[obstacles.length - 1].mesh.position.z > -100)) {
                spawnObstacle(-130);
            }

            // Update obstacles & check collisions
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.mesh.position.z += speed;

                if (Math.abs(obs.mesh.position.z - player.position.z) < 1.0 && obs.lane === currentLane) {
                    if (player.position.y < 1.4) {
                        endGame();
                        return;
                    }
                }

                if (obs.mesh.position.z > 10) {
                    scene.remove(obs.mesh);
                    obstacles.splice(i, 1);
                }
            }

            score += 1;
            const currentScoreNum = Math.floor(score / 5);
            document.getElementById('ui-score').innerText = currentScoreNum;

            // Step speed up by 0.04 every +100 score points
            const speedMultiplierTier = Math.floor(currentScoreNum / 100);
            speed = BASE_SPEED + (speedMultiplierTier * 0.04);

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            if (!camera || !renderer) return;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function togglePause() {
            if (!gameRunning) return;
            isPaused = !isPaused;
            document.getElementById('pause-overlay').style.display = isPaused ? 'flex' : 'none';
            document.getElementById('btn-pause').innerText = isPaused ? 'Resume' : 'Pause';
            if (!isPaused) requestAnimationFrame(gameLoop);
        }

        function exitToCatalog() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = '../games.html';
            }
        }

        function startGame() {
            if (!engineInitialized) initScene();

            document.getElementById('lobby-overlay').style.display = 'none';
            document.getElementById('death-overlay').style.display = 'none';
            document.getElementById('pause-overlay').style.display = 'none';
            document.getElementById('touch-controls-panel').style.display = 'flex';

            score = 0;
            speed = BASE_SPEED;
            currentLane = 1;
            isJumping = false;
            isPaused = false;
            document.getElementById('btn-pause').innerText = 'Pause';
            player.position.set(lanes[1], 0.9, 0);

            for (let obs of obstacles) scene.remove(obs.mesh);
            obstacles = [];

            gameRunning = true;
            requestAnimationFrame(gameLoop);
        }

        function endGame() {
            gameRunning = false;
            document.getElementById('touch-controls-panel').style.display = 'none';

            const final = Math.floor(score / 5);
            document.getElementById('final-score').innerText = final;

            if (final > highScore) {
                highScore = final;
                localStorage.setItem('playio_subway_highscore', highScore.toString());
                updateHighScoreDisplay();
            }

            document.getElementById('death-overlay').style.display = 'flex';
        }

        function restartGame() {
            startGame();
        }

        /* -------------------------------------------------------------
           4. CLEAN EVENT BINDINGS
        ------------------------------------------------------------- */
        function bind(id, action) {
            const el = document.getElementById(id);
            if (!el) return;
            el.addEventListener('click', (e) => {
                e.preventDefault();
                action();
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateHighScoreDisplay();

            // Direct Touch Controls
            bind('ctrl-left', moveLeft);
            bind('ctrl-right', moveRight);
            bind('ctrl-jump', doJump);

            // HUD
            bind('btn-back', exitToCatalog);
            bind('btn-pause', togglePause);

            // Lobby
            bind('btn-start-run', startGame);
            bind('btn-lobby-back', exitToCatalog);

            // Pause Menu
            bind('btn-resume', togglePause);
            bind('btn-pause-restart', restartGame);
            bind('btn-pause-quit', exitToCatalog);

            // Game Over Menu
            bind('btn-death-restart', restartGame);
            bind('btn-death-quit', exitToCatalog);

            initScene();
        });
    </script>
</body>
</html>
