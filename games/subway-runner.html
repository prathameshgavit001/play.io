<!DOCTYPE html>
<html lang="en">
<head>
    <!-- PLAYIO_GAME_METADATA_START
    {
      "id": "subway-runner",
      "title": "Subway Runner: Neon Dash",
      "category": "Action / Endless Runner",
      "description": "Solo 3D infinite runner with coins (+5), obstacle jump clearance bonus (+20), vertical icon HUD, local high scores, and SVG controls.",
      "thumbnail": "assets/thumbnails/subway-runner.png",
      "orientation": "landscape",
      "multiplayer": false
    }
    PLAYIO_GAME_METADATA_END -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Subway Runner: Neon Dash | Playio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0b0d17;
            color: #fff;
            touch-action: manipulation;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            pointer-events: none;
        }

        /* Top HUD */
        .top-bar {
            position: absolute;
            top: 14px;
            left: 14px;
            right: 14px;
            z-index: 50;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
        }

        /* Vertically stacked logo icon buttons */
        .vertical-icon-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: auto;
        }

        .icon-btn {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            background: rgba(24, 29, 48, 0.85);
            border: 1px solid #33416b;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            backdrop-filter: blur(4px);
            outline: none;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
        }
        .icon-btn svg {
            width: 22px;
            height: 22px;
            fill: #00f2fe;
            pointer-events: none;
        }
        .icon-btn:active {
            background: #00f2fe;
            border-color: #00f2fe;
        }
        .icon-btn:active svg {
            fill: #0b0d17;
        }

        /* High Score (Center) */
        .top-center {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: none;
            text-align: center;
        }
        .hud-high-score {
            font-size: 16px;
            font-weight: 900;
            letter-spacing: 0.8px;
            color: #ffd700;
            text-shadow: 0 0 12px rgba(255, 215, 0, 0.6);
            white-space: nowrap;
        }

        /* Current Score & Coins (Right) */
        .top-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
            pointer-events: none;
        }
        .hud-stat {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.6);
        }
        .hud-coins {
            font-size: 14px;
            font-weight: 700;
            color: #ffd700;
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.4);
        }

        /* Score Popups / Floating Shower */
        .score-popups {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 55;
            overflow: hidden;
        }
        .popup-float {
            position: absolute;
            font-weight: 900;
            font-size: 22px;
            animation: floatUp 0.8s ease-out forwards;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
        }
        .popup-jump { color: #38ef7d; }
        .popup-coin { color: #ffd700; }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-70px) scale(1.4); opacity: 0; }
        }

        /* SVG Touch Controls */
        .touch-controls {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 24px;
            z-index: 60;
            pointer-events: auto;
        }
        .ctrl-btn {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            border: 2px solid rgba(0, 242, 254, 0.5);
            background: rgba(15, 17, 26, 0.8);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            outline: none;
            touch-action: manipulation;
        }
        .ctrl-btn svg {
            width: 32px;
            height: 32px;
            fill: #00f2fe;
            pointer-events: none;
        }
        .ctrl-btn:active {
            transform: scale(0.92);
            background: #00f2fe;
            border-color: #00f2fe;
        }
        .ctrl-btn:active svg { fill: #050b14; }

        .ctrl-jump { border-color: rgba(56, 239, 125, 0.6); }
        .ctrl-jump svg { fill: #38ef7d; }
        .ctrl-jump:active {
            background: #38ef7d;
            border-color: #38ef7d;
        }
        .ctrl-jump:active svg { fill: #050b14; }

        /* Full Screen Modals / Overlays */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 12, 22, 0.94);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
        }
        .modal {
            background: #181d30;
            padding: 28px;
            border-radius: 14px;
            width: 360px;
            max-width: 90%;
            border: 1px solid #2d3758;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            gap: 14px;
            text-align: center;
        }
        .modal h2 {
            font-size: 26px;
            font-weight: 900;
            color: #00f2fe;
        }
        .score-highlight {
            font-size: 46px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(0, 242, 254, 0.8);
            margin: 4px 0;
        }
        .high-score-note {
            font-size: 14px;
            font-weight: 700;
            color: #ffd700;
        }

        button.action-btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            color: #050b14;
            font-weight: 800;
            font-size: 15px;
            cursor: pointer;
        }
        button.action-btn:active {
            transform: scale(0.98);
            opacity: 0.9;
        }
        button.secondary-btn {
            background: #252e4d;
            color: #e2e8f0;
        }
        button.secondary-btn:active {
            background: #323d66;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>
    <div class="score-popups" id="score-popups"></div>

    <!-- Top Bar HUD -->
    <div class="top-bar">
        <!-- Vertically Stacked SVG Icons: Back & Pause -->
        <div class="vertical-icon-group">
            <button type="button" class="icon-btn" id="btn-back" aria-label="Back">
                <!-- Back Icon -->
                <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            </button>
            <button type="button" class="icon-btn" id="btn-pause" aria-label="Pause">
                <!-- Pause Icon -->
                <svg viewBox="0 0 24 24" id="pause-svg"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>
        </div>

        <!-- High Score in Center -->
        <div class="top-center">
            <div class="hud-high-score">HIGH SCORE: <span id="ui-high-score">0</span></div>
        </div>

        <!-- Current Score & Coins on Right -->
        <div class="top-right">
            <div class="hud-stat">SCORE: <span id="ui-score">0</span></div>
            <div class="hud-coins">🪙 <span id="ui-coins">0</span></div>
        </div>
    </div>

    <!-- On-screen Bottom SVG Touch Controls -->
    <div class="touch-controls" id="touch-controls-panel" style="display: none;">
        <button type="button" class="ctrl-btn" id="ctrl-left" aria-label="Left">
            <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
        </button>
        <button type="button" class="ctrl-btn ctrl-jump" id="ctrl-jump" aria-label="Jump">
            <svg viewBox="0 0 24 24"><path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></svg>
        </button>
        <button type="button" class="ctrl-btn" id="ctrl-right" aria-label="Right">
            <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
        </button>
    </div>

    <!-- Start / Lobby Overlay -->
    <div class="overlay" id="lobby-overlay">
        <div class="modal">
            <h2>Subway Runner</h2>
            <p style="font-size: 13px; color: #94a3b8;">
                Dodge barriers, jump over obstacles for <b>+20</b>, and collect coins for <b>+5</b>!
            </p>
            <div class="high-score-note">Best Record: <span id="lobby-high-score">0</span></div>
            <button type="button" class="action-btn" id="btn-start-run">Start Run</button>
            <button type="button" class="action-btn secondary-btn" id="btn-lobby-back">Back to Catalog</button>
        </div>
    </div>

    <!-- Pause Menu Overlay -->
    <div class="overlay" id="pause-overlay" style="display: none;">
        <div class="modal">
            <h2>Game Paused</h2>
            <button type="button" class="action-btn" id="btn-resume">Resume</button>
            <button type="button" class="action-btn secondary-btn" id="btn-pause-restart">Restart</button>
            <button type="button" class="action-btn secondary-btn" id="btn-pause-quit">Quit to Catalog</button>
        </div>
    </div>

    <!-- Game Over Overlay -->
    <div class="overlay" id="death-overlay" style="display: none;">
        <div class="modal">
            <h2 style="color: #ff416c;">CRASHED!</h2>
            <div style="font-size: 13px; color: #94a3b8;">FINAL SCORE</div>
            <div class="score-highlight" id="final-score">0</div>
            <div class="high-score-note">High Score: <span id="death-high-score">0</span></div>
            <button type="button" class="action-btn" id="btn-death-restart">Run Again</button>
            <button type="button" class="action-btn secondary-btn" id="btn-death-quit">Quit to Catalog</button>
        </div>
    </div>

    <script>
        /* -------------------------------------------------------------
           1. GAME ENGINE & STATE
        ------------------------------------------------------------- */
        let scene, camera, renderer, player;
        const lanes = [-3, 0, 3];
        let currentLane = 1;
        let isJumping = false, jumpVelocity = 0;

        let distanceScore = 0;
        let bonusScore = 0;
        let coinsCollected = 0;

        const BASE_SPEED = 0.42;
        let speed = BASE_SPEED;
        let obstacles = [], coins = [], tracks = [];
        let gameRunning = false;
        let isPaused = false;
        let engineInitialized = false;

        let highScore = parseInt(localStorage.getItem('playio_subway_highscore') || '0', 10);

        function updateHighScoreDisplay() {
            document.getElementById('ui-high-score').innerText = highScore;
            document.getElementById('lobby-high-score').innerText = highScore;
            document.getElementById('death-high-score').innerText = highScore;
        }

        function initScene() {
            if (typeof THREE === 'undefined') return;

            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x0b0d17, 0.015);

            camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 4, 8);
            camera.rotation.x = -0.3;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x0b0d17);
            container.appendChild(renderer.domElement);

            const ambient = new THREE.AmbientLight(0xffffff, 0.7);
            const dirLight = new THREE.DirectionalLight(0x00f2fe, 0.8);
            dirLight.position.set(5, 10, 7);
            scene.add(ambient, dirLight);

            // Player Mesh
            const geom = new THREE.BoxGeometry(1.1, 1.8, 1.1);
            const mat = new THREE.MeshStandardMaterial({ color: 0x38ef7d, roughness: 0.25 });
            player = new THREE.Mesh(geom, mat);
            player.position.set(lanes[currentLane], 0.9, 0);
            scene.add(player);

            // Track pieces
            for (let i = 0; i < 16; i++) {
                createTrackSlice(-i * 10);
            }

            window.addEventListener('resize', onWindowResize);
            document.addEventListener('keydown', handleKeyInput);
            engineInitialized = true;
        }

        function createTrackSlice(zPos) {
            const geom = new THREE.BoxGeometry(10, 0.2, 10);
            const mat = new THREE.MeshStandardMaterial({ color: 0x181d30 });
            const track = new THREE.Mesh(geom, mat);
            track.position.set(0, -0.1, zPos);
            scene.add(track);
            tracks.push(track);
        }

        function spawnObstacle(zPos) {
            const laneIdx = Math.floor(Math.random() * 3);
            const geom = new THREE.BoxGeometry(1.6, 1.3, 1.2);
            const mat = new THREE.MeshStandardMaterial({ color: 0xff416c });
            const obs = new THREE.Mesh(geom, mat);
            obs.position.set(lanes[laneIdx], 0.65, zPos);
            scene.add(obs);
            obstacles.push({ mesh: obs, lane: laneIdx, cleared: false });

            // Spawn coins in alternate lanes
            if (Math.random() < 0.6) {
                let coinLane = (laneIdx + (Math.random() < 0.5 ? 1 : 2)) % 3;
                spawnCoin(coinLane, zPos);
            }
        }

        function spawnCoin(laneIdx, zPos) {
            const geom = new THREE.CylinderGeometry(0.45, 0.45, 0.12, 16);
            const mat = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.8, roughness: 0.2 });
            const coinMesh = new THREE.Mesh(geom, mat);
            coinMesh.rotation.x = Math.PI / 2;
            coinMesh.position.set(lanes[laneIdx], 0.8, zPos);
            scene.add(coinMesh);
            coins.push({ mesh: coinMesh, lane: laneIdx });
        }

        /* -------------------------------------------------------------
           2. VISUAL SCORE SHOWER FEEDBACK
        ------------------------------------------------------------- */
        function triggerScoreShower(text, type) {
            const container = document.getElementById('score-popups');
            const popup = document.createElement('div');
            popup.className = `popup-float ${type === 'jump' ? 'popup-jump' : 'popup-coin'}`;
            popup.innerText = text;

            // Center of screen near the player
            popup.style.left = `${window.innerWidth / 2 - 20 + (Math.random() * 40 - 20)}px`;
            popup.style.top = `${window.innerHeight / 2 + (Math.random() * 30 - 15)}px`;

            container.appendChild(popup);
            setTimeout(() => {
                if (popup.parentElement) popup.parentElement.removeChild(popup);
            }, 800);
        }

        /* -------------------------------------------------------------
           3. CONTROLS
        ------------------------------------------------------------- */
        function moveLeft() {
            if (!gameRunning || isPaused) return;
            if (currentLane > 0) currentLane--;
        }

        function moveRight() {
            if (!gameRunning || isPaused) return;
            if (currentLane < 2) currentLane++;
        }

        function doJump() {
            if (!gameRunning || isPaused) return;
            if (!isJumping) {
                isJumping = true;
                jumpVelocity = 0.35;
            }
        }

        function handleKeyInput(e) {
            if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') {
                if (gameRunning) togglePause();
                return;
            }
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') moveLeft();
            else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') moveRight();
            else if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.key === ' ') doJump();
        }

        /* -------------------------------------------------------------
           4. RUNTIME LOOP & COLLISION LOGIC
        ------------------------------------------------------------- */
        function gameLoop() {
            if (!gameRunning || isPaused) return;
            requestAnimationFrame(gameLoop);

            // Interpolate lane position
            player.position.x += (lanes[currentLane] - player.position.x) * 0.25;

            // Jump handling
            if (isJumping) {
                player.position.y += jumpVelocity;
                jumpVelocity -= 0.018;
                if (player.position.y <= 0.9) {
                    player.position.y = 0.9;
                    isJumping = false;
                }
            }

            // Move tracks
            for (let t of tracks) {
                t.position.z += speed;
                if (t.position.z > 10) t.position.z -= 160;
            }

            // Spawn obstacles
            if (Math.random() < 0.035 && (obstacles.length === 0 || obstacles[obstacles.length - 1].mesh.position.z > -100)) {
                spawnObstacle(-130);
            }

            // Manage Obstacles & Jump Clearance (+20)
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.mesh.position.z += speed;

                const zDist = Math.abs(obs.mesh.position.z - player.position.z);

                // Collision detection
                if (zDist < 1.0 && obs.lane === currentLane) {
                    if (player.position.y < 1.4) {
                        endGame();
                        return;
                    } else if (!obs.cleared) {
                        // Successfully jumped directly over obstacle
                        obs.cleared = true;
                        bonusScore += 20;
                        triggerScoreShower('+20 JUMP!', 'jump');
                    }
                }

                if (obs.mesh.position.z > 10) {
                    scene.remove(obs.mesh);
                    obstacles.splice(i, 1);
                }
            }

            // Manage Coins (+5)
            for (let i = coins.length - 1; i >= 0; i--) {
                const c = coins[i];
                c.mesh.position.z += speed;
                c.mesh.rotation.z += 0.05;

                const zDist = Math.abs(c.mesh.position.z - player.position.z);

                if (zDist < 1.1 && c.lane === currentLane) {
                    coinsCollected++;
                    bonusScore += 5;
                    document.getElementById('ui-coins').innerText = coinsCollected;
                    triggerScoreShower('+5 COIN', 'coin');

                    scene.remove(c.mesh);
                    coins.splice(i, 1);
                    continue;
                }

                if (c.mesh.position.z > 10) {
                    scene.remove(c.mesh);
                    coins.splice(i, 1);
                }
            }

            // Dynamic Total Score
            distanceScore += 1;
            const currentTotal = Math.floor(distanceScore / 5) + bonusScore;
            document.getElementById('ui-score').innerText = currentTotal;

            // Speed Scaling: Step up by 0.04 every +100 total score points
            const speedTier = Math.floor(currentTotal / 100);
            speed = BASE_SPEED + (speedTier * 0.04);

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            if (!camera || !renderer) return;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function togglePause() {
            if (!gameRunning) return;
            isPaused = !isPaused;
            document.getElementById('pause-overlay').style.display = isPaused ? 'flex' : 'none';
            if (!isPaused) requestAnimationFrame(gameLoop);
        }

        function exitToCatalog() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = '../games.html';
            }
        }

        function startGame() {
            if (!engineInitialized) initScene();

            document.getElementById('lobby-overlay').style.display = 'none';
            document.getElementById('death-overlay').style.display = 'none';
            document.getElementById('pause-overlay').style.display = 'none';
            document.getElementById('touch-controls-panel').style.display = 'flex';

            distanceScore = 0;
            bonusScore = 0;
            coinsCollected = 0;
            speed = BASE_SPEED;
            currentLane = 1;
            isJumping = false;
            isPaused = false;

            document.getElementById('ui-coins').innerText = '0';
            document.getElementById('ui-score').innerText = '0';
            player.position.set(lanes[1], 0.9, 0);

            // Clear active entities
            for (let obs of obstacles) scene.remove(obs.mesh);
            for (let c of coins) scene.remove(c.mesh);
            obstacles = [];
            coins = [];

            gameRunning = true;
            requestAnimationFrame(gameLoop);
        }

        function endGame() {
            gameRunning = false;
            document.getElementById('touch-controls-panel').style.display = 'none';

            const final = Math.floor(distanceScore / 5) + bonusScore;
            document.getElementById('final-score').innerText = final;

            if (final > highScore) {
                highScore = final;
                localStorage.setItem('playio_subway_highscore', highScore.toString());
                updateHighScoreDisplay();
            }

            document.getElementById('death-overlay').style.display = 'flex';
        }

        function restartGame() {
            startGame();
        }

        /* -------------------------------------------------------------
           5. EVENT LISTENERS
        ------------------------------------------------------------- */
        function bind(id, action) {
            const el = document.getElementById(id);
            if (!el) return;
            el.addEventListener('click', (e) => {
                e.preventDefault();
                action();
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateHighScoreDisplay();

            // Direct Touch Controls
            bind('ctrl-left', moveLeft);
            bind('ctrl-right', moveRight);
            bind('ctrl-jump', doJump);

            // Icon HUD Buttons
            bind('btn-back', exitToCatalog);
            bind('btn-pause', togglePause);

            // Lobby Buttons
            bind('btn-start-run', startGame);
            bind('btn-lobby-back', exitToCatalog);

            // Pause Menu
            bind('btn-resume', togglePause);
            bind('btn-pause-restart', restartGame);
            bind('btn-pause-quit', exitToCatalog);

            // Game Over Menu
            bind('btn-death-restart', restartGame);
            bind('btn-death-quit', exitToCatalog);

            initScene();
        });
    </script>
</body>
</html>
