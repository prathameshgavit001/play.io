<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Subway Runner: Neon Dash | Playio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #080a14;
            color: #fff;
            touch-action: none; /* Prevents browser pull-to-refresh & pinch zoom during swipes */
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Top HUD */
        .top-bar {
            position: absolute;
            top: 14px;
            left: 14px;
            right: 14px;
            z-index: 50;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
        }

        /* Stacked Logo Buttons */
        .vertical-icon-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: auto;
        }

        .icon-btn {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            background: rgba(24, 29, 48, 0.85);
            border: 1px solid #33416b;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            backdrop-filter: blur(4px);
            outline: none;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
        }
        .icon-btn svg {
            width: 22px;
            height: 22px;
            fill: #00f2fe;
            pointer-events: none;
        }
        .icon-btn:active {
            background: #00f2fe;
            border-color: #00f2fe;
        }
        .icon-btn:active svg {
            fill: #080a14;
        }

        /* High Score (Center) */
        .top-center {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: none;
            text-align: center;
        }
        .hud-high-score {
            font-size: 15px;
            font-weight: 900;
            letter-spacing: 0.8px;
            color: #ffd700;
            text-shadow: 0 0 12px rgba(255, 215, 0, 0.6);
            white-space: nowrap;
        }
        .difficulty-badge {
            font-size: 11px;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 12px;
            display: inline-block;
            margin-top: 3px;
            background: rgba(0, 242, 254, 0.2);
            border: 1px solid #00f2fe;
            color: #00f2fe;
            text-transform: uppercase;
        }

        /* Current Score & Coins (Right) */
        .top-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
            pointer-events: none;
        }
        .hud-stat {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.6);
        }
        .hud-coins {
            font-size: 14px;
            font-weight: 700;
            color: #ffd700;
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.4);
        }

        /* Score Popups */
        .score-popups {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 55;
            overflow: hidden;
        }
        .popup-float {
            position: absolute;
            font-weight: 900;
            font-size: 20px;
            animation: floatUp 0.8s ease-out forwards;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
        }
        .popup-jump { color: #38ef7d; }
        .popup-coin { color: #ffd700; }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-70px) scale(1.35); opacity: 0; }
        }

        /* Full Screen Modals */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(8, 10, 20, 0.94);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
        }
        .modal {
            background: #151928;
            padding: 26px;
            border-radius: 14px;
            width: 380px;
            max-width: 90%;
            border: 1px solid #2d3758;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            gap: 13px;
            text-align: center;
        }
        .modal h2 {
            font-size: 26px;
            font-weight: 900;
            color: #00f2fe;
        }
        .score-highlight {
            font-size: 46px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(0, 242, 254, 0.8);
            margin: 4px 0;
        }

        /* Difficulty Picker */
        .diff-title {
            font-size: 13px;
            font-weight: 700;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .diff-selector {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }
        .diff-btn {
            background: #20273d;
            border: 1px solid #33416b;
            color: #94a3b8;
            padding: 8px 4px;
            font-size: 12px;
            font-weight: 800;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.15s ease;
        }
        .diff-btn.active {
            background: #00f2fe;
            color: #080a14;
            border-color: #00f2fe;
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.4);
        }

        button.action-btn {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            color: #050b14;
            font-weight: 800;
            font-size: 15px;
            cursor: pointer;
        }
        button.action-btn:active {
            transform: scale(0.98);
            opacity: 0.9;
        }
        button.secondary-btn {
            background: #252e4d;
            color: #e2e8f0;
        }
        button.secondary-btn:active {
            background: #323d66;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
     <div id="canvas-container"></div>
    <div class="score-popups" id="score-popups"></div>

    <!-- Top Bar HUD -->
    <div class="top-bar">
        <div class="vertical-icon-group">
            <button type="button" class="icon-btn" id="btn-back" aria-label="Back">
                <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            </button>
            <button type="button" class="icon-btn" id="btn-pause" aria-label="Pause">
                <svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>
            <button type="button" class="icon-btn" id="btn-fullscreen" aria-label="Fullscreen">
                <!-- Expand / Fullscreen Icon -->
                <svg viewBox="0 0 24 24" id="fs-icon"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
            </button>
        </div>

        <div class="top-center">
            <div class="hud-high-score">HIGH SCORE: <span id="ui-high-score">0</span></div>
            <div class="difficulty-badge" id="ui-diff-badge">NORMAL</div>
        </div>

        <div class="top-right">
            <div class="hud-stat">SCORE: <span id="ui-score">0</span></div>
            <div class="hud-coins">🪙 <span id="ui-coins">0</span></div>
        </div>
    </div>

    <!-- Start / Lobby Overlay -->
    <div class="overlay" id="lobby-overlay">
        <div class="modal">
            <h2>Subway Runner</h2>
            <p style="font-size: 13px; color: #94a3b8;">
                Swipe <b>Left / Right</b> to dodge lanes.<br>
                Swipe <b>Up</b> to jump over low hurdles (+20)!<br>
                (Cannot jump tall monoliths).
            </p>

            <div class="diff-title">Choose Difficulty</div>
            <div class="diff-selector">
                <button type="button" class="diff-btn" data-diff="easy">Easy</button>
                <button type="button" class="diff-btn active" data-diff="normal">Normal</button>
                <button type="button" class="diff-btn" data-diff="hard">Hard</button>
                <button type="button" class="diff-btn" data-diff="pro">Pro</button>
            </div>

            <button type="button" class="action-btn" id="btn-start-run">Start Run</button>
            <button type="button" class="action-btn secondary-btn" id="btn-lobby-back">Back to Catalog</button>
        </div>
    </div>

    <!-- Pause Menu Overlay -->
    <div class="overlay" id="pause-overlay" style="display: none;">
        <div class="modal">
            <h2>Game Paused</h2>
            <button type="button" class="action-btn" id="btn-resume">Resume</button>
            <button type="button" class="action-btn secondary-btn" id="btn-pause-restart">Restart</button>
            <button type="button" class="action-btn secondary-btn" id="btn-pause-quit">Quit to Catalog</button>
        </div>
    </div>

    <!-- Game Over Overlay -->
    <div class="overlay" id="death-overlay" style="display: none;">
        <div class="modal">
            <h2 style="color: #ff416c;">CRASHED!</h2>
            <div style="font-size: 13px; color: #94a3b8;">FINAL SCORE</div>
            <div class="score-highlight" id="final-score">0</div>
            <div class="hud-high-score" style="margin-bottom: 5px;">High Score: <span id="death-high-score">0</span></div>
            <button type="button" class="action-btn" id="btn-death-restart">Run Again</button>
            <button type="button" class="action-btn secondary-btn" id="btn-death-quit">Quit to Catalog</button>
        </div>
    </div>

    <script>
        /* -------------------------------------------------------------
           1. GAME CONFIGURATION & DIFFICULTY SETTINGS
        ------------------------------------------------------------- */
        const DIFFICULTY_SETTINGS = {
            easy:   { baseSpeed: 0.36, speedStep: 0.025, tallChance: 0.15, spawnRate: 0.025, name: "EASY" },
            normal: { baseSpeed: 0.44, speedStep: 0.035, tallChance: 0.35, spawnRate: 0.035, name: "NORMAL" },
            hard:   { baseSpeed: 0.52, speedStep: 0.045, tallChance: 0.50, spawnRate: 0.045, name: "HARD" },
            pro:    { baseSpeed: 0.62, speedStep: 0.055, tallChance: 0.65, spawnRate: 0.055, name: "PRO" }
        };
        let currentDifficulty = 'normal';

        let scene, camera, renderer, playerGroup, sphereMesh, orbitalRing1, orbitalRing2;
        const lanes = [-3, 0, 3];
        let currentLane = 1;
        let isJumping = false, jumpVelocity = 0;

        let distanceScore = 0;
        let bonusScore = 0;
        let coinsCollected = 0;
        let speed = 0.44;

        let obstacles = [], coins = [], tracks = [];
        let gameRunning = false;
        let isPaused = false;
        let engineInitialized = false;

        let highScore = parseInt(localStorage.getItem('playio_subway_highscore') || '0', 10);

        function updateHighScoreDisplay() {
            document.getElementById('ui-high-score').innerText = highScore;
            document.getElementById('death-high-score').innerText = highScore;
        }

        /* -------------------------------------------------------------
           2. 3D SCENE & ENGINE
        ------------------------------------------------------------- */
        function initScene() {
            if (typeof THREE === 'undefined') return;

            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x080a14, 0.015);

            camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 4.2, 8.5);
            camera.rotation.x = -0.32;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x080a14);
            container.appendChild(renderer.domElement);

            const ambient = new THREE.AmbientLight(0xffffff, 0.6);
            const dirLight = new THREE.DirectionalLight(0x00f2fe, 0.9);
            dirLight.position.set(5, 12, 7);
            scene.add(ambient, dirLight);

            // Sphere / Orb Runner with Orbiting Rings
            playerGroup = new THREE.Group();

            const sphereGeom = new THREE.SphereGeometry(0.75, 32, 32);
            const sphereMat = new THREE.MeshStandardMaterial({
                color: 0x00f2fe,
                emissive: 0x007299,
                roughness: 0.15,
                metalness: 0.7
            });
            sphereMesh = new THREE.Mesh(sphereGeom, sphereMat);
            playerGroup.add(sphereMesh);

            const ringGeom1 = new THREE.TorusGeometry(1.05, 0.05, 8, 32);
            const ringMat1 = new THREE.MeshBasicMaterial({ color: 0x38ef7d });
            orbitalRing1 = new THREE.Mesh(ringGeom1, ringMat1);
            playerGroup.add(orbitalRing1);

            const ringGeom2 = new THREE.TorusGeometry(1.15, 0.04, 8, 32);
            const ringMat2 = new THREE.MeshBasicMaterial({ color: 0xff007f });
            orbitalRing2 = new THREE.Mesh(ringGeom2, ringMat2);
            orbitalRing2.rotation.x = Math.PI / 2;
            playerGroup.add(orbitalRing2);

            playerGroup.position.set(lanes[currentLane], 0.75, 0);
            scene.add(playerGroup);

            // Road Slices
            for (let i = 0; i < 16; i++) {
                createTrackSlice(-i * 10);
            }

            window.addEventListener('resize', onWindowResize);
            document.addEventListener('keydown', handleKeyInput);
            initSwipeControls();
            engineInitialized = true;
        }

        function createTrackSlice(zPos) {
            const geom = new THREE.BoxGeometry(10.2, 0.2, 10);
            const mat = new THREE.MeshStandardMaterial({ color: 0x111625 });
            const track = new THREE.Mesh(geom, mat);
            track.position.set(0, -0.1, zPos);

            const lineGeom = new THREE.BoxGeometry(0.1, 0.22, 10);
            const lineMat = new THREE.MeshBasicMaterial({ color: 0x1f2945 });
            const leftLine = new THREE.Mesh(lineGeom, lineMat);
            leftLine.position.set(-1.5, 0, 0);
            const rightLine = new THREE.Mesh(lineGeom, lineMat);
            rightLine.position.set(1.5, 0, 0);
            track.add(leftLine, rightLine);

            scene.add(track);
            tracks.push(track);
        }

        /* -------------------------------------------------------------
           3. OBSTACLES & COINS
        ------------------------------------------------------------- */
        function spawnObstacle(zPos) {
            const laneIdx = Math.floor(Math.random() * 3);
            const cfg = DIFFICULTY_SETTINGS[currentDifficulty];
            const isTall = Math.random() < cfg.tallChance;

            let obsMesh;
            let type = "hurdle";
            let height = 1.1;

            if (isTall) {
                type = "tall";
                height = 3.6;
                const geom = new THREE.BoxGeometry(1.8, height, 1.2);
                const mat = new THREE.MeshStandardMaterial({
                    color: 0x7928ca,
                    emissive: 0x2d004d,
                    roughness: 0.3
                });
                obsMesh = new THREE.Mesh(geom, mat);
                obsMesh.position.set(lanes[laneIdx], height / 2, zPos);
            } else if (Math.random() < 0.5) {
                type = "hurdle";
                height = 0.95;
                const geom = new THREE.BoxGeometry(1.9, height, 0.8);
                const mat = new THREE.MeshStandardMaterial({
                    color: 0xff3366,
                    emissive: 0x66001a,
                    roughness: 0.3
                });
                obsMesh = new THREE.Mesh(geom, mat);
                obsMesh.position.set(lanes[laneIdx], height / 2, zPos);
            } else {
                type = "cone";
                height = 1.25;
                const geom = new THREE.ConeGeometry(0.9, height, 16);
                const mat = new THREE.MeshStandardMaterial({
                    color: 0xff8c00,
                    emissive: 0x662900,
                    roughness: 0.2
                });
                obsMesh = new THREE.Mesh(geom, mat);
                obsMesh.position.set(lanes[laneIdx], height / 2, zPos);
            }

            scene.add(obsMesh);
            obstacles.push({
                mesh: obsMesh,
                lane: laneIdx,
                type: type,
                height: height,
                cleared: false
            });

            if (Math.random() < 0.65) {
                let coinLane = (laneIdx + (Math.random() < 0.5 ? 1 : 2)) % 3;
                spawnCoin(coinLane, zPos);
            }
        }

        function spawnCoin(laneIdx, zPos) {
            const geom = new THREE.CylinderGeometry(0.45, 0.45, 0.12, 16);
            const mat = new THREE.MeshStandardMaterial({
                color: 0xffd700,
                emissive: 0x443300,
                metalness: 0.85,
                roughness: 0.2
            });
            const coinMesh = new THREE.Mesh(geom, mat);
            coinMesh.rotation.x = Math.PI / 2;
            coinMesh.position.set(lanes[laneIdx], 0.8, zPos);
            scene.add(coinMesh);
            coins.push({ mesh: coinMesh, lane: laneIdx });
        }

        function triggerScoreShower(text, type) {
            const container = document.getElementById('score-popups');
            const popup = document.createElement('div');
            popup.className = `popup-float ${type === 'jump' ? 'popup-jump' : 'popup-coin'}`;
            popup.innerText = text;
            popup.style.left = `${window.innerWidth / 2 - 20 + (Math.random() * 40 - 20)}px`;
            popup.style.top = `${window.innerHeight / 2 - 10 + (Math.random() * 30 - 15)}px`;

            container.appendChild(popup);
            setTimeout(() => {
                if (popup.parentElement) popup.parentElement.removeChild(popup);
            }, 800);
        }
         /* -------------------------------------------------------------
           4. CONTROLS (SWIPE ENGINE + KEYBOARD)
        ------------------------------------------------------------- */
        function moveLeft() {
            if (!gameRunning || isPaused) return;
            if (currentLane > 0) currentLane--;
        }

        function moveRight() {
            if (!gameRunning || isPaused) return;
            if (currentLane < 2) currentLane++;
        }

        function doJump() {
            if (!gameRunning || isPaused) return;
            if (!isJumping) {
                isJumping = true;
                jumpVelocity = 0.36;
            }
        }

        function handleKeyInput(e) {
            if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') {
                if (gameRunning) togglePause();
                return;
            }
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') moveLeft();
            else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') moveRight();
            else if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.key === ' ') doJump();
        }

        // Swipe Detection
        function initSwipeControls() {
            let startX = 0;
            let startY = 0;
            const threshold = 30; // Minimum distance in px to register a swipe

            window.addEventListener('touchstart', (e) => {
                if (e.touches.length > 0) {
                    startX = e.touches[0].clientX;
                    startY = e.touches[0].clientY;
                }
            }, { passive: true });

            window.addEventListener('touchend', (e) => {
                if (!gameRunning || isPaused) return;
                if (e.changedTouches.length === 0) return;

                const endX = e.changedTouches[0].clientX;
                const endY = e.changedTouches[0].clientY;

                const diffX = endX - startX;
                const diffY = endY - startY;

                // Determine whether swipe is primarily horizontal or vertical
                if (Math.abs(diffX) > Math.abs(diffY)) {
                    // Horizontal swipe
                    if (Math.abs(diffX) > threshold) {
                        if (diffX > 0) moveRight();
                        else moveLeft();
                    }
                } else {
                    // Vertical swipe (Only jump on swipe UP)
                    if (Math.abs(diffY) > threshold && diffY < 0) {
                        doJump();
                    }
                }
            }, { passive: true });
        }

        /* -------------------------------------------------------------
           5. FULLSCREEN API HANDLER
        ------------------------------------------------------------- */
        function toggleFullscreen() {
            const doc = document;
            const docEl = document.documentElement;

            const requestFs = docEl.requestFullscreen || docEl.mozRequestFullScreen || docEl.webkitRequestFullScreen || docEl.msRequestFullscreen;
            const exitFs = doc.exitFullscreen || doc.mozCancelFullScreen || doc.webkitExitFullscreen || doc.msExitFullscreen;
            const isFs = doc.fullscreenElement || doc.mozFullScreenElement || doc.webkitFullscreenElement || doc.msFullscreenElement;

            if (!isFs) {
                if (requestFs) {
                    requestFs.call(docEl).catch(() => {});
                }
            } else {
                if (exitFs) {
                    exitFs.call(doc);
                }
            }
        }

        function updateFullscreenIcon() {
            const isFs = document.fullscreenElement || document.webkitFullscreenElement;
            const iconSvg = document.getElementById('fs-icon');
            if (!iconSvg) return;

            if (isFs) {
                // Compress / Exit Fullscreen SVG Icon
                iconSvg.innerHTML = `<path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/>`;
            } else {
                // Expand / Enter Fullscreen SVG Icon
                iconSvg.innerHTML = `<path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>`;
            }
            onWindowResize();
        }

        document.addEventListener('fullscreenchange', updateFullscreenIcon);
        document.addEventListener('webkitfullscreenchange', updateFullscreenIcon);

        /* -------------------------------------------------------------
           6. GAME LOOP & ANIMATION
        ------------------------------------------------------------- */
        function gameLoop() {
            if (!gameRunning || isPaused) return;
            requestAnimationFrame(gameLoop);

            // Interpolate lane position
            playerGroup.position.x += (lanes[currentLane] - playerGroup.position.x) * 0.25;

            // Rolling Sphere + Rings
            sphereMesh.rotation.x -= speed * 0.5;
            orbitalRing1.rotation.y += 0.05;
            orbitalRing1.rotation.x += 0.03;
            orbitalRing2.rotation.z += 0.04;
            orbitalRing2.rotation.y += 0.02;

            // Jump Physics
            if (isJumping) {
                playerGroup.position.y += jumpVelocity;
                jumpVelocity -= 0.019;
                if (playerGroup.position.y <= 0.75) {
                    playerGroup.position.y = 0.75;
                    isJumping = false;
                }
            }

            // Move Track Slices
            for (let t of tracks) {
                t.position.z += speed;
                if (t.position.z > 10) t.position.z -= 160;
            }

            // Spawn Obstacles
            const cfg = DIFFICULTY_SETTINGS[currentDifficulty];
            if (Math.random() < cfg.spawnRate && (obstacles.length === 0 || obstacles[obstacles.length - 1].mesh.position.z > -95)) {
                spawnObstacle(-130);
            }

            // Update Obstacles & Check Collisions
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.mesh.position.z += speed;

                const zDist = Math.abs(obs.mesh.position.z - playerGroup.position.z);

                if (zDist < 1.1 && obs.lane === currentLane) {
                    const playerBottom = playerGroup.position.y - 0.6;

                    if (playerBottom < obs.height) {
                        endGame();
                        return;
                    } else if (!obs.cleared) {
                        obs.cleared = true;
                        bonusScore += 20;
                        triggerScoreShower('+20 JUMP!', 'jump');
                    }
                }

                if (obs.mesh.position.z > 10) {
                    scene.remove(obs.mesh);
                    obstacles.splice(i, 1);
                }
            }

            // Update Coins
            for (let i = coins.length - 1; i >= 0; i--) {
                const c = coins[i];
                c.mesh.position.z += speed;
                c.mesh.rotation.z += 0.06;

                const zDist = Math.abs(c.mesh.position.z - playerGroup.position.z);

                if (zDist < 1.1 && c.lane === currentLane) {
                    coinsCollected++;
                    bonusScore += 5;
                    document.getElementById('ui-coins').innerText = coinsCollected;
                    triggerScoreShower('+5 COIN', 'coin');

                    scene.remove(c.mesh);
                    coins.splice(i, 1);
                    continue;
                }

                if (c.mesh.position.z > 10) {
                    scene.remove(c.mesh);
                    coins.splice(i, 1);
                }
            }

            // Score & Dynamic Speed Progression
            distanceScore += 1;
            const currentTotal = Math.floor(distanceScore / 5) + bonusScore;
            document.getElementById('ui-score').innerText = currentTotal;

            const speedTier = Math.floor(currentTotal / 100);
            speed = cfg.baseSpeed + (speedTier * cfg.speedStep);

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            if (!camera || !renderer) return;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function togglePause() {
            if (!gameRunning) return;
            isPaused = !isPaused;
            document.getElementById('pause-overlay').style.display = isPaused ? 'flex' : 'none';
            if (!isPaused) requestAnimationFrame(gameLoop);
        }

        function exitToCatalog() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = '../games.html';
            }
        }

        function setDifficulty(diff) {
            currentDifficulty = diff;
            document.querySelectorAll('.diff-btn').forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('data-diff') === diff);
            });
            document.getElementById('ui-diff-badge').innerText = DIFFICULTY_SETTINGS[diff].name;
        }

        function startGame() {
            if (!engineInitialized) initScene();

            document.getElementById('lobby-overlay').style.display = 'none';
            document.getElementById('death-overlay').style.display = 'none';
            document.getElementById('pause-overlay').style.display = 'none';

            distanceScore = 0;
            bonusScore = 0;
            coinsCollected = 0;
            speed = DIFFICULTY_SETTINGS[currentDifficulty].baseSpeed;
            currentLane = 1;
            isJumping = false;
            isPaused = false;

            document.getElementById('ui-coins').innerText = '0';
            document.getElementById('ui-score').innerText = '0';
            playerGroup.position.set(lanes[1], 0.75, 0);

            for (let obs of obstacles) scene.remove(obs.mesh);
            for (let c of coins) scene.remove(c.mesh);
            obstacles = [];
            coins = [];

            gameRunning = true;
            requestAnimationFrame(gameLoop);
        }

        function endGame() {
            gameRunning = false;

            const final = Math.floor(distanceScore / 5) + bonusScore;
            document.getElementById('final-score').innerText = final;

            if (final > highScore) {
                highScore = final;
                localStorage.setItem('playio_subway_highscore', highScore.toString());
                updateHighScoreDisplay();
            }

            document.getElementById('death-overlay').style.display = 'flex';
        }

        function restartGame() {
            startGame();
        }

           /* -------------------------------------------------------------
           7. EVENT BINDINGS
        ------------------------------------------------------------- */
        function bind(id, action) {
            const el = document.getElementById(id);
            if (!el) return;
            el.addEventListener('click', (e) => {
                e.preventDefault();
                action();
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateHighScoreDisplay();

            // Icon HUD
            bind('btn-back', exitToCatalog);
            bind('btn-pause', togglePause);
            bind('btn-fullscreen', toggleFullscreen);

            // Lobby & Difficulty
            bind('btn-start-run', startGame);
            bind('btn-lobby-back', exitToCatalog);

            document.querySelectorAll('.diff-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    setDifficulty(btn.getAttribute('data-diff'));
                });
            });

            // Pause Menu
            bind('btn-resume', togglePause);
            bind('btn-pause-restart', restartGame);
            bind('btn-pause-quit', exitToCatalog);

            // Game Over Menu
            bind('btn-death-restart', restartGame);
            bind('btn-death-quit', exitToCatalog);

            initScene();
        });
    </script>
</body>
</html>
