    <title>Subway Runner: Neon Dash | Playio</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; -webkit-user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #0b0d17; color: #fff; }
        
        /* Three.js Canvas container - isolated background */
        #canvas-container {
            width: 100%; height: 100%; position: absolute;
            top: 0; left: 0; z-index: 1; pointer-events: none;
        }

        /* Top Bar Navigation & Stats */
        .top-bar {
            position: absolute; top: 16px; left: 16px; right: 16px;
            z-index: 50; display: flex; justify-content: space-between;
            align-items: center; pointer-events: none;
        }
        .top-group { display: flex; align-items: center; gap: 10px; pointer-events: auto; }
        .hud-stat {
            font-size: 18px; font-weight: 800; letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.6);
        }
        .hud-btn {
            background: rgba(24, 29, 48, 0.85); border: 1px solid #33416b;
            color: #fff; padding: 8px 14px; border-radius: 8px; font-size: 13px;
            font-weight: 700; cursor: pointer; transition: 0.15s ease; backdrop-filter: blur(4px);
            pointer-events: auto;
        }
        .hud-btn:active { background: #00f2fe; color: #0b0d17; }

        .room-tag {
            background: rgba(16, 20, 35, 0.85); padding: 6px 12px; border-radius: 6px;
            border: 1px solid #38ef7d; font-size: 12px; font-weight: 700;
        }

        /* On-Screen Touch / Click Controls */
        .touch-controls {
            position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 20px; z-index: 60; pointer-events: auto;
        }
        .ctrl-btn {
            width: 72px; height: 72px; border-radius: 50%;
            border: 2px solid rgba(0, 242, 254, 0.5);
            background: rgba(15, 17, 26, 0.75); backdrop-filter: blur(8px);
            color: #fff; font-size: 24px; font-weight: 900;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; -webkit-tap-highlight-color: transparent;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        .ctrl-btn:active {
            transform: scale(0.92); background: #00f2fe; color: #050b14;
        }
        .ctrl-jump { border-color: rgba(56, 239, 125, 0.6); }
        .ctrl-jump:active { background: #38ef7d; color: #050b14; }

        /* Full Screen Modals / Overlays */
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 12, 22, 0.92); backdrop-filter: blur(8px);
            z-index: 100; display: flex; justify-content: center; align-items: center;
            pointer-events: auto;
        }
        .modal {
            background: #181d30; padding: 28px; border-radius: 14px;
            width: 380px; max-width: 90%; border: 1px solid #2d3758;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8); display: flex;
            flex-direction: column; gap: 14px; text-align: center;
            position: relative; z-index: 110;
        }
        .modal h2 { font-size: 24px; font-weight: 900; color: #00f2fe; }
        .score-highlight {
            font-size: 42px; font-weight: 900; color: #ffffff;
            text-shadow: 0 0 20px rgba(0, 242, 254, 0.8); margin: 6px 0;
        }
        .modal input {
            background: #0d101d; border: 1px solid #33416b; color: #fff;
            padding: 12px 14px; border-radius: 8px; font-size: 14px; width: 100%;
            outline: none; pointer-events: auto;
        }
        .modal input:focus { border-color: #00f2fe; }
        .btn-group { display: flex; gap: 10px; }
        button.action-btn {
            flex: 1; padding: 12px; border: none; border-radius: 8px;
            background: linear-gradient(135deg, #00f2fe, #4facfe); color: #050b14;
            font-weight: 800; font-size: 14px; cursor: pointer; transition: 0.15s ease;
            pointer-events: auto;
        }
        button.action-btn:active { transform: scale(0.98); opacity: 0.9; }
        button.secondary-btn {
            background: #252e4d; color: #e2e8f0;
        }
        button.secondary-btn:active { background: #323d66; }

        /* Scoreboard Panel */
        #scoreboard-panel {
            position: absolute; bottom: 110px; right: 20px; z-index: 70;
            background: rgba(16, 20, 35, 0.92); border: 1px solid #33416b;
            border-radius: 10px; padding: 14px 18px; width: 280px; max-height: 280px;
            overflow-y: auto; display: none; box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            pointer-events: auto;
        }
        #scoreboard-panel h3 {
            font-size: 13px; color: #00f2fe; margin-bottom: 10px;
            text-transform: uppercase; letter-spacing: 0.8px; font-weight: 800;
        }
        .score-entry {
            display: flex; justify-content: space-between; font-size: 13px;
            padding: 6px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }
        .score-entry.self { color: #38ef7d; font-weight: 800; }
    </style>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

<body>

    <div id="canvas-container"></div>

    <!-- Top Bar Controls & Stats -->
    <div class="top-bar">
        <div class="top-group">
            <button class="hud-btn" id="btn-back">◀ Back</button>
            <button class="hud-btn" id="btn-pause">Pause</button>
            <div class="hud-stat">SCORE: <span id="ui-score">0</span></div>
        </div>

        <div class="top-group">
            <div class="room-tag" id="ui-room-tag" style="display: none;">
                Room: <span id="ui-room-name">----</span> | PIN: <span id="ui-pin-name">----</span>
            </div>
            <button class="hud-btn" id="btn-toggle-lb" style="display: none;">Leaderboard</button>
        </div>
    </div>

    <!-- On-screen directional & jump controls -->
    <div class="touch-controls" id="touch-controls-panel" style="display: none;">
        <div class="ctrl-btn" id="ctrl-left">◀</div>
        <div class="ctrl-btn ctrl-jump" id="ctrl-jump">▲</div>
        <div class="ctrl-btn" id="ctrl-right">▶</div>
    </div>

    <!-- Live In-Game Room Scoreboard -->
    <div id="scoreboard-panel">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
            <h3>Room Leaderboard</h3>
            <span style="cursor: pointer; font-size: 16px; color: #94a3b8;" id="btn-close-lb">✕</span>
        </div>
        <div id="leaderboard-list"></div>
    </div>

    <!-- Lobby / Room Configuration Overlay -->
    <div class="overlay" id="lobby-overlay">
        <div class="modal">
            <h2>Subway Runner</h2>
            <p style="font-size: 13px; color: #94a3b8;">Enter a nickname and launch solo or start a room.</p>
            <input type="text" id="player-nickname" placeholder="Nickname (e.g. SpeedDemon)" maxlength="12" value="Runner1">

            <div class="btn-group">
                <button class="action-btn" id="btn-show-create">Create Room</button>
                <button class="action-btn secondary-btn" id="btn-show-join">Join Room</button>
            </div>

            <div id="create-fields" style="display:none; flex-direction:column; gap:10px;">
                <input type="text" id="create-pin" placeholder="Set Room PIN (4 digits)" maxlength="4">
                <button class="action-btn" id="btn-host-launch">Launch & Host</button>
            </div>

            <div id="join-fields" style="display:none; flex-direction:column; gap:10px;">
                <input type="text" id="join-room-id" placeholder="Enter 6-digit Room Code" maxlength="6">
                <input type="text" id="join-pin" placeholder="Enter Room PIN" maxlength="4">
                <button class="action-btn" id="btn-join-launch">Connect & Play</button>
            </div>

            <button class="action-btn secondary-btn" id="btn-play-solo">Play Solo</button>
            <button class="action-btn secondary-btn" id="btn-lobby-back">Back to Catalog</button>

    <!-- Pause Menu Overlay -->
    <div class="overlay" id="pause-overlay" style="display: none;">
        <div class="modal">
            <h2>Game Paused</h2>
            <button class="action-btn" id="btn-resume">Resume</button>
            <button class="action-btn secondary-btn" id="btn-pause-lb">View Leaderboard</button>
            <button class="action-btn secondary-btn" id="btn-pause-restart">Restart</button>
            <button class="action-btn secondary-btn" id="btn-pause-quit">Quit to Catalog</button>
        </div>
    </div>

    <!-- Game Over Overlay -->
    <div class="overlay" id="death-overlay" style="display: none;">
        <div class="modal">
            <h2 style="color: #ff416c;">CRASHED!</h2>
            <div style="font-size: 13px; color: #94a3b8;">FINAL SCORE</div>
            <div class="score-highlight" id="final-score">0</div>
            <button class="action-btn" id="btn-death-restart">Run Again</button>
            <button class="action-btn secondary-btn" id="btn-death-lb">View Leaderboard</button>
            <button class="action-btn secondary-btn" id="btn-death-quit">Quit to Catalog</button>
        </div>
    </div>

    <script>
        /* -------------------------------------------------------------
           1. THREE.JS 3D ENGINE
        ------------------------------------------------------------- */
        let scene, camera, renderer, player;
        const lanes = [-3, 0, 3];
        let currentLane = 1;
        let isJumping = false, jumpVelocity = 0;
        let score = 0, speed = 0.42;
        let obstacles = [], tracks = [];
        let gameRunning = false;
        let isPaused = false;

        function initScene() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x0b0d17, 0.015);

            camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 4, 8);
            camera.rotation.x = -0.3;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x0b0d17);
            container.appendChild(renderer.domElement);

            const ambient = new THREE.AmbientLight(0xffffff, 0.7);
            const dirLight = new THREE.DirectionalLight(0x00f2fe, 0.8);
            dirLight.position.set(5, 10, 7);
            scene.add(ambient, dirLight);

            // Player mesh
            const geom = new THREE.BoxGeometry(1.1, 1.8, 1.1);
            const mat = new THREE.MeshStandardMaterial({ color: 0x38ef7d, roughness: 0.25 });
            player = new THREE.Mesh(geom, mat);
            player.position.set(lanes[currentLane], 0.9, 0);
            scene.add(player);

            // Track pieces
            for (let i = 0; i < 16; i++) {
                createTrackSlice(-i * 10);
            }

            window.addEventListener('resize', onWindowResize);
            document.addEventListener('keydown', handleKeyInput);
            bindEvents();
        }

        function createTrackSlice(zPos) {
            const geom = new THREE.BoxGeometry(10, 0.2, 10);
            const mat = new THREE.MeshStandardMaterial({ color: 0x181d30 });
            const track = new THREE.Mesh(geom, mat);
            track.position.set(0, -0.1, zPos);
            scene.add(track);
            tracks.push(track);
        }

        function spawnObstacle(zPos) {
            const laneIdx = Math.floor(Math.random() * 3);
            const geom = new THREE.BoxGeometry(1.6, 1.4, 1.2);
            const mat = new THREE.MeshStandardMaterial({ color: 0xff416c });
            const obs = new THREE.Mesh(geom, mat);
            obs.position.set(lanes[laneIdx], 0.7, zPos);
            scene.add(obs);
            obstacles.push({ mesh: obs, lane: laneIdx });
        }

        function moveLeft() {
            if (!gameRunning || isPaused) return;
            if (currentLane > 0) currentLane--;
        }

        function moveRight() {
            if (!gameRunning || isPaused) return;
            if (currentLane < 2) currentLane++;
        }

        function doJump() {
            if (!gameRunning || isPaused) return;
            if (!isJumping) {
                isJumping = true;
                jumpVelocity = 0.33;
            }
        }

        function handleKeyInput(e) {
            if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') {
                if (gameRunning) togglePause();
                return;
            }
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') moveLeft();
            else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') moveRight();
            else if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.key === ' ') doJump();
        }

        function gameLoop() {
            if (!gameRunning || isPaused) return;
            requestAnimationFrame(gameLoop);

            player.position.x += (lanes[currentLane] - player.position.x) * 0.25;

            if (isJumping) {
                player.position.y += jumpVelocity;
                jumpVelocity -= 0.018;
                if (player.position.y <= 0.9) {
                    player.position.y = 0.9;
                    isJumping = false;
                }
            }

            for (let t of tracks) {
                t.position.z += speed;
                if (t.position.z > 10) t.position.z -= 160;
            }

            if (Math.random() < 0.035 && (obstacles.length === 0 || obstacles[obstacles.length - 1].mesh.position.z > -100)) {
                spawnObstacle(-130);
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.mesh.position.z += speed;

                if (Math.abs(obs.mesh.position.z - player.position.z) < 1.0 && obs.lane === currentLane) {
                    if (player.position.y < 1.4) {
                        endGame();
                        return;
                    }
                }

                if (obs.mesh.position.z > 10) {
                    scene.remove(obs.mesh);
                    obstacles.splice(i, 1);
                }
            }

            score += 1;
            speed += 0.00004;
            document.getElementById('ui-score').innerText = Math.floor(score / 5);

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function togglePause() {
            if (!gameRunning) return;
            isPaused = !isPaused;
            document.getElementById('pause-overlay').style.display = isPaused ? 'flex' : 'none';
            document.getElementById('btn-pause').innerText = isPaused ? 'Resume' : 'Pause';
            if (!isPaused) requestAnimationFrame(gameLoop);
        }

        function exitToCatalog() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = '../games.html';
            }
        }

        function startGame() {
            document.getElementById('lobby-overlay').style.display = 'none';
            document.getElementById('death-overlay').style.display = 'none';
            document.getElementById('pause-overlay').style.display = 'none';
            document.getElementById('touch-controls-panel').style.display = 'flex';

            score = 0;
            speed = 0.42;
            currentLane = 1;
            isJumping = false;
            isPaused = false;
            document.getElementById('btn-pause').innerText = 'Pause';
            player.position.set(lanes[1], 0.9, 0);

            for (let obs of obstacles) scene.remove(obs.mesh);
            obstacles = [];

            gameRunning = true;
            requestAnimationFrame(gameLoop);
        }

        function endGame() {
            gameRunning = false;
            document.getElementById('touch-controls-panel').style.display = 'none';
            const final = Math.floor(score / 5);
            document.getElementById('final-score').innerText = final;
            document.getElementById('death-overlay').style.display = 'flex';
            syncScore(final);
        }

        function restartGame() {
            document.getElementById('scoreboard-panel').style.display = 'none';
            startGame();
        }

        /* -------------------------------------------------------------
           2. MULTIPLAYER ROOMS & SCOREBOARDS (PeerJS)
        ------------------------------------------------------------- */
        let peer = null;
        let connections = [];
        let isHost = false;
        let roomCode = "";
        let roomPIN = "";
        let nickname = "Runner";
        let scoreTable = {};

        function startSolo() {
            nickname = document.getElementById('player-nickname').value.trim() || "Runner";
            scoreTable["local"] = { name: nickname, score: 0 };
            renderScoreboard();
            startGame();
        }

        function setupRoomUI(code, pin) {
            document.getElementById('ui-room-tag').style.display = 'block';
            document.getElementById('btn-toggle-lb').style.display = 'block';
            document.getElementById('ui-room-name').innerText = code;
            document.getElementById('ui-pin-name').innerText = pin;
        }

        function toggleLeaderboard() {
            const panel = document.getElementById('scoreboard-panel');
            panel.style.display = (panel.style.display === 'block') ? 'none' : 'block';
        }

        function showLeaderboardModal() {
            document.getElementById('scoreboard-panel').style.display = 'block';
        }

        function initHostRoom() {
            nickname = document.getElementById('player-nickname').value.trim() || "HostRunner";
            roomPIN = document.getElementById('create-pin').value.trim();
            roomCode = Math.floor(100000 + Math.random() * 900000).toString();

            try {
                peer = new Peer("playio-subway-" + roomCode);
            } catch (e) {
                alert("PeerJS initialization error. Playing solo mode.");
                startSolo();
                return;
            }

            peer.on('open', () => {
                isHost = true;
                setupRoomUI(roomCode, roomPIN || "None");
                scoreTable[peer.id] = { name: nickname, score: 0 };
                renderScoreboard();
                startGame();
            });
