<!DOCTYPE html>
<html lang="en">
<head>
<!--
GAME_META
title: Memory Match
badge: Puzzle
description: Flip and match pairs of emojis in as few moves as possible.
-->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memory Match - Play.io</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0d1117; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
    .top-bar { width: 100%; max-width: 360px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .top-bar a { color: #58a6ff; text-decoration: none; font-weight: 600; }
    .grid { display: grid; grid-template-columns: repeat(4, 75px); gap: 10px; }
    .card { width: 75px; height: 75px; background: #161b22; border: 2px solid #30363d; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 2rem; cursor: pointer; user-select: none; }
    .card.revealed { background: #21262d; border-color: #58a6ff; }
    .card.matched { background: #238636; border-color: #2ea043; cursor: default; }
    .btn { margin-top: 24px; padding: 12px 28px; background: #238636; border: none; border-radius: 6px; color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer; }
    .btn:hover { background: #2ea043; }
  </style>
</head>
<body>
  <div class="top-bar">
    <a href="../games.html">&larr; Back to Games</a>
    <div>Moves: <span id="moves">0</span></div>
  </div>

  <div class="grid" id="grid"></div>
  <button class="btn" onclick="init()">Restart Match</button>

  <script>
    const emojis = ["🎮", "👾", "🕹️", "⚡", "🚀", "💎"];
    let cards = [...emojis, ...emojis];
    let flipped = [];
    let matchedCount = 0;
    let moves = 0;
    let lock = false;

    function shuffle(arr) { return arr.sort(() => Math.random() - 0.5); }

    function init() {
      const grid = document.getElementById("grid");
      grid.innerHTML = "";
      cards = shuffle([...emojis, ...emojis]);
      flipped = [];
      matchedCount = 0;
      moves = 0;
      lock = false;
      document.getElementById("moves").innerText = moves;

      cards.forEach((emoji) => {
        const div = document.createElement("div");
        div.className = "card";
        div.dataset.emoji = emoji;
        div.onclick = () => flipCard(div);
        grid.appendChild(div);
      });
    }

    function flipCard(card) {
      if (lock || card.classList.contains("revealed") || card.classList.contains("matched")) return;
      card.classList.add("revealed");
      card.innerText = card.dataset.emoji;
      flipped.push(card);

      if (flipped.length === 2) {
        moves++;
        document.getElementById("moves").innerText = moves;
        lock = true;
        if (flipped[0].dataset.emoji === flipped[1].dataset.emoji) {
          flipped[0].classList.add("matched");
          flipped[1].classList.add("matched");
          matchedCount += 2;
          flipped = [];
          lock = false;
          if (matchedCount === cards.length) {
            setTimeout(() => alert(`Victory! Cleared in ${moves} moves.`), 300);
          }
        } else {
          setTimeout(() => {
            flipped[0].classList.remove("revealed");
            flipped[1].classList.remove("revealed");
            flipped[0].innerText = "";
            flipped[1].innerText = "";
            flipped = [];
            lock = false;
          }, 800);
        }
      }
    }
    init();
  </script>
</body>
</html>
