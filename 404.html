<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Page Not Found</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #0d1117; color: #e6edf3; display: flex; align-items: center; justify-content: center; height: 100vh; text-align: center; padding: 20px; }
    .box { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 40px 30px; max-width: 480px; width: 100%; }
    h1 { font-size: 4rem; color: #58a6ff; margin-bottom: 8px; }
    h2 { font-size: 1.4rem; margin-bottom: 12px; }
    p { color: #8b949e; margin-bottom: 24px; }
    .btn { display: inline-block; padding: 10px 20px; background: #238636; color: #fff; text-decoration: none; border-radius: 6px; font-weight: 600; }
    .btn:hover { background: #2ea043; }
  </style>
</head>
<body>
  <div class="box">
    <h1>404</h1>
    <h2>Game Over: Page Not Found</h2>
    <p>The link you opened does not exist or may have been moved.</p>
    <a href="index.html" class="btn">Return to Arcade Home</a>
  </div>
</body>
</html>
